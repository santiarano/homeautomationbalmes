name: StandByMePad
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  StandByMePad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: webos-app
        type: folder
        buildPhase: resources
    info:
      path: Sources/StandByMePad/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.santiarano.standbymepad
        PRODUCT_NAME: StandByMePad
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
